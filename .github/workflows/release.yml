name: Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency: release-plz-${{ github.ref }}

jobs:
  release-plz:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cache Webots download
        id: cache-webots
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/webots.tar.bz2
          key: webots-R2025a-x86-64.tar.bz2

      - name: Download Webots
        if: steps.cache-webots.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/cyberbotics/webots/releases/download/R2025a/webots-R2025a-x86-64.tar.bz2 \
            --output "$RUNNER_TEMP/webots.tar.bz2"

      - name: Install Webots
        shell: bash
        run: |
          set -euo pipefail
          tar -xjf "$RUNNER_TEMP/webots.tar.bz2" -C "$RUNNER_TEMP"
          echo "WEBOTS_HOME=$RUNNER_TEMP/webots" >> "$GITHUB_ENV"

      - name: Update release PR
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish crates and create GitHub release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
